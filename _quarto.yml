project:
  type: website
  # Write the rendered website to docs/, so GitHub Pages can serve it from there
  output-dir: docs
  # Only render the .qmd pages, so readme.md, CLAUDE.md and PLAN.md do not become pages
  render:
    - "*.qmd"

website:
  title: "First look at your sequencing data"
  page-navigation: true
  sidebar:
    style: "docked"
    search: true
    # GitHub icon in the sidebar, links to the repository
    tools:
      - icon: github
        href: https://github.com/ndombrowski/sequencing_qc
    contents:
      - index.qmd
      - source/cli_minimum.qmd
      - source/first_look.qmd
      - source/deeper_dive.qmd

format:
  html:
    theme:
      light: [lumen, styles.scss]
      dark: [cyborg, styles.scss]
    toc: true
    code-copy: true

engine: knitr 
execute:
  freeze: auto
  eval: false